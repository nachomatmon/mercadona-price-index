name: Captura diaria del índice

on:
  schedule:
    - cron: '15 7 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/run.py
      - name: Guardar histórico y sitio
        run: |
          git config user.name 'mercadona-index-bot'
          git config user.email 'mercadona-index-bot@users.noreply.github.com'
          git add data docs out
          git diff --cached --quiet || git commit -m "data: captura $(date -I)"
          git push
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: capture
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sitio estático
        id: deployment
        uses: actions/deploy-pages@v4
